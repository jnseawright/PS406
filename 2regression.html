### Why Regression? From Experiments to Observational Studies

- In an experiment, random assignment ensures that treatment is independent of potential outcomes.
- In observational data, we worry that treated and control units differ on other characteristics (confounders).
- Regression attempts to **adjust for those differences** by holding confounders constant.

---
### The Intuition: Adjusting for a Confounder


``` r
lm_biased &lt;- lm(Stateterrorism ~ TrumpShare, data = election2016)
coef(lm_biased)["TrumpShare"]
```

```
## TrumpShare 
## -0.2110919
```

``` r
# Adjust for past election and Turnout
lm_adjusted &lt;- lm(Stateterrorism ~ TrumpShare + Turnout16 + Turnout12 + D12Margin, data = election2016)
coef(lm_adjusted)["TrumpShare"]
```

```
## TrumpShare 
## 0.02730885
```
---

- The coefficient changes because we are now comparing treated and control units having subtracted off the estimated effects of turnout and electoral history.
- This is the core idea: **control for confounders to mimic randomization**.

---
### When Does This Work? The Key Assumption

**Unconfoundedness (selection on observables)**  

`$$D_i \perp\!\!\!\perp (Y_i(0), Y_i(1)) \mid X_i$$`


---

- Conditional on observed covariates \(X\), treatment is as good as randomly assigned.
- This means: no unmeasured confounders that affect both treatment and outcome.

---

How reasonable is this assumption in observational studies? For example, does the Trump and terrorism regression plausibly meet this standard? (What would need to be true?)

---

**Overlap / Common Support**  
For every combination of values of \(X\), there must be both treated and control units.

---

### Visualizing Confounding with DAGs

![](2regression_files/figure-html/confounder_dag-1.png)&lt;!-- --&gt;

---

- \(X\) is a confounder: it affects both treatment \(D\) and outcome \(Y\).
- Controlling for \(X\) blocks the backdoor path `\(D \leftarrow X \rightarrow Y\)`.
- This gives us the causal effect of `\(D\)` on `\(Y\)`.


---
### What Does "Controlling For" Mean?

- Intuitively: we are asking what the relationship between treatment and outcome would be if past elections were held constant.
- Mathematically: regression uses the variation in treatment that is **not explained by past elections** to estimate the effect.

**Key idea**: Including a confounder removes its influence from both treatment and outcome, reducing bias.

---
### When Is a Variable a Confounder?

A confounder is a variable that:
1.  Affects the treatment,
2.  Affects the outcome,
3.  Is not itself affected by the treatment.

---
### Good Controls: Block Backdoor Paths

Any variable that lies on a backdoor path from `\(D\)` to `\(Y\)` and is not itself a descendant of `\(D\)` is a **good control**.

Example from the terrorism study: `past turnout` and `voting history` are plausible confounders – they might affect both vote choice in 2016 and subsequent terrorism.

---
### Bad Controls: Mediators

![](2regression_files/figure-html/mediator_dag-1.png)&lt;!-- --&gt;

---

- `\(M\)` is a **mediator**: it lies on the causal path from `\(D\)` to `\(Y\)`.
- Controlling for `\(M\)` would **block part of the causal effect** we want to estimate.
- This is a form of **overcontrol bias**.

In the Peru study, if `enojado` (anger) is a mediator, we should **not** control for it when estimating the total effect of `simpletreat` on voting.

---
### Bad Controls: Colliders

![](2regression_files/figure-html/collider_dag-1.png)&lt;!-- --&gt;

---

- `\(C\)` is a **collider**: it is caused by both `\(D\)` and `\(Y\)`.
- Conditioning on a collider **opens a non‑causal path** `\(D \rightarrow C \leftarrow Y\)`, creating **selection bias**.

---

- Example: if we control for a variable that is itself affected by treatment and outcome (e.g., turnout in 2020 in the terrorism example), we can introduce bias.

---
### Bad Controls: Post‑Treatment Variables

Any variable that is caused by the treatment is **post‑treatment**.  
Controlling for such a variable can:

- Block part of the causal effect (if it is a mediator),
- Create collider bias (if it is also affected by other factors),
- Generally lead to incorrect estimates.

---

**Rule of thumb**: Only control for variables measured **before** treatment.

---
### Translating DAGs to Regression Practice

When building a regression model for causal inference:

1.  **List all potential confounders** – variables that affect both treatment and outcome.
2.  **Draw a DAG** (even informally) to check for backdoor paths.
3.  **Do not control for mediators or colliders**.
4.  **Do not control for post‑treatment variables**.
5.  **Include interactions if you suspect heterogeneous effects** (more on this later).

---
### The Problem of Unobserved Confounders

We can only control for variables we have measured.  
If an important confounder is unmeasured, our estimate may still be biased.

This is why **sensitivity analysis** is crucial – we need to ask: how strong would an unmeasured confounder have to be to overturn our conclusion?

(We will return to this in later weeks.)

---
### Summary: Regression for Causal Inference

- Regression can reduce bias by adjusting for confounders.
- Use DAGs to decide which variables to control for.
- Avoid bad controls: mediators, colliders, post‑treatment variables.
- Unobserved confounders remain a threat – be humble.
- Heterogeneous effects mean the regression coefficient is a weighted average; explore variation.

### Is it better to include all but one control variable, or have fewer?

It turns out, maybe surprisingly, that there isn't just one answer to this question.

* Sometimes, you will get an estimate with less bias by leaving out valid control variables from an incomplete model.

* Sometimes you will do better by including as many control variables as you can even if you don't know them all.

* We don't know which scenario is which in general.

---
### How Much Does It Hurt to Be Wrong?

Suppose we know we can get a good causal inference from a regression with two control variables and our treatment, but we don't have access to any way of measuring one of those control variables. We have two options:

1.  Estimate a regression including the treatment and one control variable.

2.  Estimate a bivariate regression including only the treatment.

---

Both of these options will have omitted variable bias. 

1.  The first option will have the bias due to leaving out the unmeasurable variable.

2.  The second option will have the bias due to leaving out the unmeasurable variable, and the bias due to leaving out the measured control variable.

---

These two sources of bias can point in the same direction, in which scenario the second option will usually be worse than the first. Or the two sources of bias can point in opposite directions, in which scenario the second option can often be better than the first.

## When Does Adding a Control Variable Help?

-   Adding a control variable reduces overall bias when the still-omitted variables and the newly added variable have effects on the outcome that point in the same direction and are positively correlated with each other.

-   Adding it increases bias when those two quantities have opposite signs, or when they have the same sign but are negatively correlated. The new control pulls the estimate the wrong way relative to what's still missing.

---

-   Since we rarely know the signs and correlations of unmeasured confounders, this is largely a judgment call. As Clarke emphasizes, the two scenarios are roughly equally common in principle.

---
### Regression for Causal Inference

-   If the causal effect is not constant across all cases, regression
    will not give a consistent estimate of the average treatment effect.

-   Instead, it estimates a covariance-adjusted weighted average of
    cases' treatment effects.

---

### Chattopadhyay and Zubizarreta 2023

`$$\hat{\tau}_{OLS} = \sum_{i:D_{i}=1} w_{i} Y_{i} - \sum_{i:D_{i}=0} w_{i} Y_{i}$$`

---
### Chattopadhyay and Zubizarreta 2023

There is a different set of weights called the ''multi-regression imputation'' or MRI:

`$$\hat{\tau}_{MRI} = \sum_{i:D_{i}=1} w^{MRI}_{i}(\bar{X}) Y_{i} - \sum_{i:D_{i}=0} w^{MRI}_{i}(\bar{X}) Y_{i}$$`

`$$w^{MRI}_{i}(x) = n^{−1}_{T} + (X_{i} − \bar{X}_{T})^{T}S^{−1}_{T}(x − \bar{X}_{T})$$`

---
### Chattopadhyay and Zubizarreta 2023

If there is causal heterogeneity, the OLS weights are a biased estimator of ATE, but the MRI weights can be an unbiased estimator.

``` r
preslmw.uri &lt;- lmw(~ br_pres + as.factor(ht_colonial) + br_pvote, data = qog2000demsin2020clean,
