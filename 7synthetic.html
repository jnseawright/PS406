### Manufacture Perfect Comparisons

Strictly speaking, for the Method of Difference to work based on a
comparison between cases 1 and 2, the condition which must be met is:

`$$\begin{aligned}
Y_{1,t} = Y_{2,t}\\
Y_{1,c} = Y_{2,c}\end{aligned}$$`

---
### Manufacture Perfect Comparisons

No observable condition can ever guarantee that this assumption is met,
but if we were to find two cases that *exactly* match on a suitably rich
set of background variables `\(\mathbb{Z}\)`, perhaps, we would come close to believing the
assumption.

---
### Manufacture Perfect Comparisons

Unfortunately, if `\(\mathbb{Z}\)` is indeed a reasonably deep list of
variables, we are unlikely to find cases that in fact exactly match (or
even come particularly close).

---
### Manufacture Perfect Comparisons

Abadie and collaborators suggest that we create our own "synthetic"
control cases, by averaging together existing control cases to come as
close as possible to exactly matching the treatment case on
`\(\mathbb{Z}\)`.

---
### Synthetic Control

The setup is one in which there are `\(N\)` cases, each of which is observed
at multiple time periods labeled from 1 through `\(T\)`.

---
### Synthetic Control

Each case has a treatment and control potential outcome for each time
period. The difference between these is:

`\(\alpha_{i,t} = Y^T_{i,t} - Y^C_{i,t}\)`

---
### Synthetic Control

Suppose that the treatment of interest happens in *one* case at one time
period. That is, `\(D_{j,t}=0\)` for all `\(j \neq i\)` and for all
`\(t &lt; t_{treat}\)`.

---
### Synthetic Control

Let `\(X_{i} = (\mathbb{Z}_{i}, Y_{i})\)`

Minimize `\(X_{i, t} -  \mathbb{X}_{j, t} W\)` for `\(t &lt; t_{treat}\)`.

---
### Synthetic Control

`\(\sqrt{(X_{i, t} -  \mathbb{X}_{j, t} W)^{T} V (X_{i, t} -  \mathbb{X}_{j, t} W)}\)`

---
### Synthetic Control: The Optimization Problem

We choose weights `\(W = (w_1, \ldots, w_J)\)` to minimize:

`$$\sqrt{(X_{i} - \mathbb{X}_{j} W)^{T} V (X_{i} - \mathbb{X}_{j} W)}$$`

subject to:

`$$w_j \geq 0 \quad \forall j, \qquad \sum_{j=1}^{J} w_j = 1$$`

---

-   The non-negativity constraint ensures the synthetic control is a proper **weighted average** of donor units — not an extrapolation beyond the observed data. The sum-to-one constraint means the synthetic control is a **convex combination**, keeping it inside the support of the donor pool.

-   Together, these constraints give the method its interpretability: the solution `\(W^*\)` tells you exactly which real cases, and in what proportions, make up your synthetic control.

---
&lt;img src="images/choosingv.png" width="90%" style="display: block; margin: auto;" /&gt;

---
### Choosing V: Weighting the Predictors

The distance metric used to find optimal weights W depends on a matrix **V** — a diagonal matrix that determines how much each predictor in `\(\mathbb{Z}\)` contributes to the match.

- If V gives high weight to a predictor, cases that differ on that variable will be penalized heavily in the match.
- If V gives low (or zero) weight, that predictor is effectively ignored.

---

-   **Why does V matter?** Two synthetic controls that match equally well on raw predictors can have very different pre-treatment outcome trajectories — and only the one that prioritizes outcome-relevant predictors will produce a credible counterfactual.

-   **How is V chosen?** Abadie et al. recommend selecting V to minimize the prediction error of the synthetic control on the *outcome* during the pre-treatment period. 

-   In other words, we are choosing V specifically to meet the criterion of making the synthetic control's pre-treatment `\(Y\)` track the treated unit's `\(Y\)` as closely as possible.

Synthetic control allows us to use data to ask what a case's counterfactual might have been. While there are assumptions, we are imposing fewer modeling decisions than usual.

For the rest of this week, we will push the concern with minimizing the consequences of modeling decisions even further.

---
### Why Sensitivity Analysis?

Many causal inference methods rely on **untestable assumptions**:
- Unconfoundedness (selection on observables)
- Parallel trends (DiD)
- Exclusion restriction (IV)
- Continuity (RDD)
- No interference (SUTVA)

---
### Why Sensitivity Analysis?

We can never definitively prove these assumptions hold.  
Sensitivity analysis asks: **How much would the assumptions have to be violated to change our conclusions?**

---
### The Core Question

**If the identifying assumption were false, how different would the results need to be to overturn our inference?**

---
### The Core Question

For example:
- In a DiD study, what if the parallel trends assumption failed by a certain amount?
- In an IV study, what if the instrument had a small direct effect on the outcome?
- In a regression study, what if an unmeasured confounder existed?

Sensitivity analysis quantifies the robustness of findings to such violations.

---
### Two Broad Approaches

| Approach | Description | Example |
|----------|-------------|---------|
| **Informal / Multiverse** | Estimate the same question under many plausible specifications | Specification curve analysis, robustness checks |
| **Formal / Parametric** | Introduce a sensitivity parameter that measures the degree of violation, and derive bounds or adjusted estimates | Rosenbaum bounds, Manski bounds, sensitivity parameters in regression |

---
### Two Broad Approaches

Both approaches help assess whether results are **fragile** (easily overturned) or **robust** (withstand substantial violations).

---
### Informal Sensitivity: The "Multiverse"

Instead of one model, estimate many reasonable models.

---
### Informal Sensitivity: The "Multiverse"



``` r
# Example: vary control variables, sample restrictions, etc.
results &lt;- list()
for (controls in list(c("age"), c("age", "Cuzco"), c("age", "Cuzco", "edlevel"))) {
  f &lt;- as.formula(paste("outsidervote ~ simpletreat +", 
                        paste(controls, collapse = " + ")))
  results[[paste(controls, collapse = "_")]] &lt;- lm(f, data = peruemotions)
}

### Formal Sensitivity: A Parameter for Violation

Introduce a parameter that captures the **strength of unmeasured confounding**.

Example (linear regression with omitted variable):
`$$Y = \beta D + \gamma U + \epsilon$$`
`$$D = \pi U + \nu$$`

If `\(U\)` is unobserved, the bias in `\(\hat{\beta}\)` is approximately `\(\gamma \times \pi\)`.

---
### Formal Sensitivity: A Parameter for Violation

Sensitivity analysis asks: **How large would `\(\gamma\)` and `\(\pi\)` need to be to reduce `\(\hat{\beta}\)` to zero (or to change its sign)?**

---
### The Robustness Value

A useful concept from `sensemakr` (Cinelli &amp; Hazlett 2020):

**Robustness Value (RV)**: The minimum strength of association (partial `\(R^2\)`) that an unmeasured confounder would need to have with both treatment and outcome to **fully explain away** the estimated effect.

---
### The Robustness Value

- RV close to 1 → very robust (confounder would need to explain almost all residual variation).
- RV close to 0 → fragile (even a weak confounder could overturn the result).

---
### Preview: Methods We'll Cover

| Method | When to Use | Key Output |
|--------|-------------|------------|
| **Rosenbaum bounds** | Matched pairs / stratified designs | Range of p‑values under increasing hidden bias (`\(\Gamma\)`) |
| **Manski bounds** | Binary outcomes, no assumptions | Worst‑case bounds on ATE |
| **Sensitivity parameters (`sensemakr`)** | Linear regression | Robustness value, contour plots |

---
### Rosenbaum Bounds

Consider a single matched pair of cases in a matching study, or a joined
treatment and control case in a stratified experiment. These individuals
*should* have the same propensity score (probability of assignment to the treatment). If there is confounding, will they?

---
### Rosenbaum Bounds: Motivation

In a matched study, we compare treated and control units that are similar on observed covariates. But what if they differ on an **unmeasured confounder**?

Rosenbaum bounds ask: **How much hidden bias would need to be present to alter our conclusions?**

---
### The Sensitivity Parameter Gamma

Let `\(\pi_i\)` be the probability that unit `\(i\)` receives treatment, given observed covariates.  
In a matched pair, the odds ratio of treatment for the two units is:

`$$\frac{\pi_{i1}/(1-\pi_{i1})}{\pi_{i2}/(1-\pi_{i2})}$$`

If matching on observables removed all bias, this odds ratio = 1 for every pair.

---
### The Sensitivity Parameter Gamma

The sensitivity parameter `\(\Gamma\)` bounds this odds ratio:

`$$\frac{1}{\Gamma} \leq \frac{\pi_{i1}/(1-\pi_{i1})}{\pi_{i2}/(1-\pi_{i2})} \leq \Gamma$$`

- `\(\Gamma = 1\)`: no hidden bias (treatment assignment is effectively random within pairs).
- `\(\Gamma &gt; 1\)`: hidden bias may cause one unit to be up to `\(\Gamma\)` times more likely to receive treatment than its matched control.

---
### What Does Gamma Mean?

If `\(\Gamma = 2\)`, an unmeasured confounder could make a treated unit **twice as likely** to receive treatment as its matched control, even after matching on observables.

We ask: **At what value of `\(\Gamma\)` would our statistically significant result become non‑significant (p &gt; 0.05)?**  
If that happens at a small `\(\Gamma\)`, the result is sensitive; if it requires a large `\(\Gamma\)`, the result is robust.

---

### A Simple Numerical Example

Imagine a matched study with 10 pairs. In each pair, one unit is treated, one is control. We observe a binary outcome (success/failure). Suppose we have 8 pairs where treated succeeded and control failed (1,0), 1 pair where control succeeded and treated failed (0,1), 0 pair where both succeeded, and 1 where both failed.

---

### Test Statistic

A common test is **McNemar's test**, which uses only the discordant pairs (those where outcomes differ: (1,0) and (0,1)). Let:
- `\(n_a\)` = number of pairs with (treated=1, control=0) = 8  
- `\(n_b\)` = number of pairs with (treated=0, control=1) = 1  

Under the null of no effect, the treated unit in each discordant pair is equally likely to be the success. The test statistic is binomial with `\(n = n_a + n_b = 9\)` and `\(p = 0.5\)`.

---

### Without Hidden Bias `\(\Gamma = 1\)`

The probability of observing `\(n_a \geq 8\)` under the null is:


`$$P(X \geq 8) = \sum_{k=8}^{9} \binom{9}{k} (0.5)^9
= \binom{9}{8}(0.5)^9 + \binom{9}{9}(0.5)^9
\approx 0.0195$$`

This p‑value &lt; 0.05 – the result is **statistically significant** when there is no hidden bias.

---

### Introducing Hidden Bias

If `\(\Gamma &gt; 1\)`, the treated unit in a discordant pair could be up to `\(\Gamma\)` times more likely to be the success even under the null.  
Under the worst‑case (upper bound), the null probability becomes:

`$$p = \frac{\Gamma}{1 + \Gamma}$$`

---

### Effect of `\(\Gamma\)` on the Upper‑Bound p‑Value

| `\(\Gamma\)` | Null probability `\(p = \Gamma/(1+\Gamma)\)` | Upper‑bound p‑value `\(P(X \geq 8)\)` |
|------------|--------------------------------------------|-------------------------------------|
| 1.0        | 0.500                                      | 0.0195                              |
| 1.5        | 0.600                                      | ?                                   |
| 2.0        | 0.667                                      | ?                                   |
| 2.5        | 0.714                                      | ?                                   |
| 3.0        | 0.750                                      | ?                                   |

We can compute the exact values in R.

---


``` r
# Function to compute upper bound p-value for given gamma
rosenbaum_p &lt;- function(gamma, n_a, n_b) {
  n &lt;- n_a + n_b
  p &lt;- gamma / (1 + gamma)
  sum(dbinom(n_a:n, size = n, prob = p))
}

gammas &lt;- c(1, 1.5, 2, 2.5, 3)
results &lt;- data.frame(
  Gamma = gammas,
  p_upper = sapply(gammas, rosenbaum_p, n_a = 8, n_b = 1)
)
results
```

```
##   Gamma    p_upper
## 1   1.0 0.01953125
## 2   1.5 0.07054387
## 3   2.0 0.14306762
## 4   2.5 0.22264119
## 5   3.0 0.30033875
```

---

### Interpreting the Results

- At `\(\Gamma = 1.5\)`, the upper‑bound p‑value is 0.0705 – still significant.
- At `\(\Gamma = 2.0\)`, the upper‑bound p‑value is 0.1431 – still significant.
- At `\(\Gamma = 2.5\)`, the upper‑bound p‑value crosses 0.2226 – now above 0.05.

Thus, the result is robust to an unobserved confounder that increases the odds of treatment by up to **2.0 times**, but it becomes non‑significant if the hidden bias is stronger than that.

---

### Summary: Rosenbaum Bounds

- Rosenbaum bounds assess sensitivity to an unmeasured confounder in matched studies.
- The sensitivity parameter `\(\Gamma\)` quantifies how much hidden bias could affect treatment assignment.
- For each `\(\Gamma\)`, we compute the **worst‑case p‑value**.

---

- If the p‑value remains below 0.05 even at moderate `\(\Gamma\)` (say, `\(\Gamma=2\)`), the result is robust.

- If it crosses 0.05 at a small `\(\Gamma\)`, the result is sensitive.

**Important: Rosenbaum bounds are conservative – they assume the worst possible pattern of hidden bias. If the result survives, it is robust to any such bias.**

### Interpreting the Sensitivity Contour Plot

- **What the plot shows:**  
  - The **x‑axis** is the hypothetical partial \(R^2\) of an unmeasured confounder with the treatment.  
  - The **y‑axis** is the partial \(R^2\) of that confounder with the outcome.  

---

- **What the plot shows:**  
  - Each **red contour** corresponds to a different adjusted treatment effect. The **bold red curve** shows the combinations of confounding strengths that would **reduce the estimated effect to exactly zero** — i.e., fully explain it away.  
  - The **diamond** marks the benchmark strength of an observed covariate (here, `age`).

---

- **How to read the robustness value (RV):**  
  - The **robustness value** is the minimum strength of association (partial \(R^2\)) that an unmeasured confounder must have with *both* the treatment and the outcome to make the estimated effect zero.  
  - A **high RV** (close to 1) means the result is very robust; a **low RV** (close to 0) means the result is fragile.  
  - In the plot, the RV is shown as the point where the **dashed line** intersects the axes — it’s the smallest circle that touches the zero‑effect contour.

---

- **In our Peru example:**  
  - The first model (`outsidervote ~ simpletreat`) has a robustness value of 0.106.  
  - The second model, with more controls, has a robustness value of 0.141.  
  - This means that after adjusting for covariates, an unmeasured confounder would need to explain about 14.1% of the residual variance of both the treatment and the outcome to nullify the effect — a moderately robust finding.

### Manski Bounds: Setting

We consider a binary outcome `\(Y \in \{0,1\}\)` and binary treatment `\(D \in \{0,1\}\)`.  
Potential outcomes: `\(Y(1)\)`, `\(Y(0)\)`. The average treatment effect is:

`$$ATE = E[Y(1)] - E[Y(0)]$$`

We observe `\(Y\)` only under the actual treatment received. The challenge: for each unit, we are missing the counterfactual outcome.

---
### Worst-Case Bounds (No Assumptions)

Without any assumptions, what can we say about `\(ATE\)`?

We know:
- `\(\small E[Y(1)] = P(Y=1 | D=1)P(D=1) + P(Y=1 | D=0)P(D=0)\)`  
  The first term is observed; the second term is unobserved, but `\(P(Y=1 | D=0)\)` lies between 0 and 1.
- Similarly, `\(\small E[Y(0)] = P(Y=1 | D=0)P(D=0) + P(Y=1 | D=1)P(D=1)\)`.

---
### Lower Bound

To get the smallest possible `\(ATE\)`, we make the unobserved counterfactuals as extreme as possible in opposite directions:

- For treated units (`\(D=1\)`), their untreated outcome `\(Y(0)\)` could be as high as 1.
- For untreated units (`\(D=0\)`), their treated outcome `\(Y(1)\)` could be as low as 0.

This gives:

`$$\tiny ATE_{lower} = P(Y=1|D=1)P(D=1) + 0\cdot P(D=0) - [1\cdot P(D=1) + P(Y=1|D=0)P(D=0)]$$`
---

Simplify:

`$$\tiny ATE_{lower} = P(Y=1|D=1)P(D=1) - P(Y=1|D=0)P(D=0) - P(D=1)$$`

---
### Upper Bound

For the largest possible `\(ATE\)`:

- For treated units, `\(Y(0)\)` could be 0.
- For untreated units, `\(Y(1)\)` could be 1.

Then:

`$$\tiny ATE_{upper} = P(Y=1|D=1)P(D=1) + 1\cdot P(D=0) - [0\cdot P(D=1) + P(Y=1|D=0)P(D=0)]$$`

Simplify:

`$$\tiny ATE_{upper} = P(Y=1|D=1)P(D=1) - P(Y=1|D=0)P(D=0) + P(D=0)$$`

---
### A Concrete Example: NSW Job Training Data


``` r
nswre_treated &lt;- read.table("http://users.nber.org/~rdehejia/data/nswre74_treated.txt")

colnames(nswre_treated) &lt;- c("treat","age","edu","black","hispanic", "married","nodegree","RE74","RE75","RE78")

nswre_control &lt;- read.table("http://users.nber.org/~rdehejia/data/nswre74_control.txt") 

colnames(nswre_control) &lt;- c("treat","age","edu","black","hispanic","married","nodegree","RE74","RE75","RE78")

nswre &lt;- rbind(nswre_treated,nswre_control)

D &lt;- nswre$treat
Y &lt;- (nswre$RE78 &gt; 0)
X &lt;- with(nswre, cbind(age,edu,black,hispanic,married,nodegree,RE74/1000,RE75/1000))
```

---

We have:

- `\(D=1\)` (treatment): 297 treated units.
- `\(D=0\)` (control): 425 control units.
- Outcome `\(Y\)`: 1 if earnings in 1978 &gt; 0, 0 otherwise.

---

Let's compute the observed shares:


``` r
Y &lt;- nswre$RE78 &gt; 0   # binary outcome
D &lt;- nswre$treat

p1 &lt;- mean(Y[D == 1])   # P(Y=1|D=1)
p0 &lt;- mean(Y[D == 0])   # P(Y=1|D=0)
prop_treat &lt;- mean(D)   # P(D=1)

cat("P(Y=1|D=1) =", round(p1, 3), "\n")
```

```
## P(Y=1|D=1) = 0.757
```

``` r
cat("P(Y=1|D=0) =", round(p0, 3), "\n")
```

```
## P(Y=1|D=0) = 0.646
```

``` r
cat("P(D=1) =", round(prop_treat, 3), "\n")
```

```
## P(D=1) = 0.416
```

---
### Compute Manski Bounds

Now plug into the formulas:


``` r
lower &lt;- p1 * prop_treat - p0 * (1 - prop_treat) - prop_treat
upper &lt;- p1 * prop_treat - p0 * (1 - prop_treat) + (1 - prop_treat)

cat("Manski bounds without covariates: [", round(lower, 3), ", ", round(upper, 3), "]\n")
```

```
## Manski bounds without covariates: [ -0.479 ,  0.521 ]
```

Interpretation: The ATE on the probability of positive earnings lies somewhere between -0.479 and 0.521. These bounds are wide because we made no assumptions.

---
### What Do These Bounds Tell Us?

- The bounds always contain the true ATE.
- They are **worst‑case** bounds; any additional assumptions will narrow them.
- Here, the interval includes zero, so we cannot rule out no effect (or even a negative effect) without further assumptions.

---
### Narrowing Bounds with Covariates

If we condition on covariates `\(X\)`, we can compute bounds within each stratum and then average. This often narrows the bounds because within strata, the unobserved outcomes are less extreme.

The `ATbounds` package does this automatically. 

---


``` r
library(ATbounds)
bns_nsw &lt;- atebounds(Y, D, X, rep(mean(D),length(D)), Q=1)
summary(bns_nsw)
```

```
## ATbounds: ATE
## Call: atebounds(Y = Y, D = D, X = X, rps = rep(mean(D), length(D)), 
## Call:     Q = 1)
## Confidence Level: 0.95
##                     Lower_Bound Upper_Bound
## Bound Estimate         -0.45843     0.50112
## Confidence Interval    -0.74966     0.77878
```

``` r
bns_nsw_pool2 &lt;- atebounds(Y, D, X, rep(mean(D),length(D)), Q=2)
summary(bns_nsw_pool2)
```

```
## ATbounds: ATE
## Call: atebounds(Y = Y, D = D, X = X, rps = rep(mean(D), length(D)), 
## Call:     Q = 2)
## Confidence Level: 0.95
##                     Lower_Bound Upper_Bound
## Bound Estimate         0.083059     0.10125
## Confidence Interval   -0.014176     0.21192
```

---

- `Q=1` means no pooling across observations.
- `Q=2` pools across neighboring observations vis-a-vis the covariates.


---
### Summary: Manski Bounds

- Manski bounds provide **worst‑case** bounds on the ATE using only the data and no assumptions.
- They are often wide, but they are **guaranteed** to contain the truth.
- Adding covariates (or other assumptions) can narrow the bounds.
- They are useful as a benchmark: if the bounds exclude zero, we have evidence of an effect even without any assumptions.

---

**In practice**, we rarely rely solely on worst‑case bounds; we combine them with plausible assumptions to get tighter intervals. But they remind us that all causal inference rests on assumptions – and show how much those assumptions buy us.

---
### Manski Bounds: Ecological Inference

**Ecological inference problem**: We have aggregate data (e.g., voting totals by precinct) but want to know individual-level behavior (e.g., how individuals voted by race).

- Suppose we know the fraction of Black voters in a precinct, and the fraction who voted for a candidate.
- We want to know the fraction of Black voters who voted for the candidate.

Without individual-level data, the parameter is **partially identified** – Manski bounds give the range consistent with the aggregates.

---
### Ecological Inference: Example

In a precinct:
- 60% of voters are Black, 40% are White.
- 55% voted for Candidate A.

Let `\(\beta_B\)` = fraction of Black voters who voted for A, `\(\beta_W\)` = fraction of White voters who voted for A.  
We have:

`$$0.6 \beta_B + 0.4 \beta_W = 0.55$$`

`\(\beta_B\)` and `\(\beta_W\)` are unknown, but must lie in `\([0,1]\)`. What are the possible values of `\(\beta_B\)`?

---
### Bounding `\(\beta_B\)`

Solve for `\(\beta_W\)`: `\(\beta_W = (0.55 - 0.6\beta_B)/0.4\)`.

Since `\(0 \le \beta_W \le 1\)`, we get:

`$$0 \le \frac{0.55 - 0.6\beta_B}{0.4} \le 1$$`

Multiply by 0.4: `\(0 \le 0.55 - 0.6\beta_B \le 0.4\)`

---

Rearrange for bounds on `\(\beta_B\)`:

- Lower bound: `\(0.55 - 0.6\beta_B \ge 0\)` → `\(\beta_B \le 0.55/0.6 \approx 0.917\)`
- Upper bound: `\(0.55 - 0.6\beta_B \le 0.4\)` → `\(\beta_B \ge (0.55-0.4)/0.6 = 0.25\)`

Also `\(\beta_B \in [0,1]\)`, so combined: `\(\beta_B \in [0.25, 0.917]\)`.

Thus, even without any further assumptions, we know Black support for A is between 25% and 91.7%.

---
### Ecological Inference with Multiple Precincts

With multiple precincts, the bounds tighten. The `ATbounds` package can compute these bounds for ecological inference problems (though its main focus is treatment effects). The logic is the same: observed aggregates + worst‑case individual outcomes give the range of possible individual-level parameters.

---
### Manski Bounds: Missing Data

**Missing data problem**: Outcomes are missing for some units. We want to estimate the mean of `\(Y\)`, `\(E[Y]\)`.

- Let `\(R=1\)` if `\(Y\)` observed, `\(R=0\)` if missing.
- Observed data: `\((R_i, R_i Y_i)\)`.
- The challenge: `\(\small E[Y] = P(R=1)E[Y|R=1] + P(R=0)E[Y|R=0]\)`.

`\(E[Y|R=1]\)` is identified from complete cases; `\(E[Y|R=0]\)` is completely unknown. Without assumptions, it could be any value in the support of `\(Y\)`.

---
### Worst‑Case Bounds for Missing Data

If `\(Y\)` is bounded, say `\(Y \in [0,1]\)`, then:

- Lower bound: `\(E[Y] \ge P(R=1)E[Y|R=1] + P(R=0)\cdot 0\)`
- Upper bound: `\(E[Y] \le P(R=1)E[Y|R=1] + P(R=0)\cdot 1\)`

Thus:

`$$\tiny P(R=1)E[Y|R=1] \le E[Y] \le P(R=1)E[Y|R=1] + P(R=0)$$`

These are the **Manski bounds for missing data**.

---
### Example: Missing Data in a Survey

Suppose in a survey of 1000 people, 800 respond to a question, and the mean response among respondents is 0.6 (on a 0‑1 scale).  
Then `\(P(R=1)=0.8\)`, `\(E[Y|R=1]=0.6\)`, `\(P(R=0)=0.2\)`.

Lower bound = `\(0.8 \times 0.6 = 0.48\)`  
Upper bound = `\(0.48 + 0.2 = 0.68\)`

So the true population mean lies between 0.48 and 0.68. Without assumptions on nonrespondents, this is all we can say.

---
### Narrowing Bounds with Covariates

If we have covariates `\(X\)` observed for all units, we can compute bounds conditional on `\(X\)` and then average. This typically narrows the bounds because we can predict `\(Y\)` better.

`ATbounds` can handle missing data by setting the treatment to missingness indicator and the outcome to `\(Y\)`. The bounds for the ATE become bounds for the population mean under missingness.

---
### Summary: Manski Bounds for Ecological Inference and Missing Data

- **Ecological inference**: Aggregate data bound individual parameters.
- **Missing data**: Observed data bound the population mean.
- In both cases, worst‑case bounds are **wide** but **assumption‑free**.
- Adding covariates, monotonicity, or other assumptions narrows the bounds.
- The same logic underlies partial identification in many settings.

---

**Key takeaway**: Even when we cannot point‑identify a parameter, we may still learn something useful from the data under minimal assumptions.

---
### Sensitivity Analysis

One approach to sensitivity analysis is to average all the credible
models. But why a simple average?

---
### Ensemble Models: The Basic Intuition

Instead of choosing **one** model, why not combine **many**?

An **ensemble** combines multiple models to improve prediction:
- Each model might capture different patterns in the data.
- The ensemble averages out individual model errors.
- Often performs better than any single model.

---
### Ensemble Models: The Basic Intuition

**Famous examples**: Random forests (ensemble of decision trees), gradient boosting, Netflix Prize winner.

---
### Ensemble Methods for Causal Inference

Athey et al. (2019) propose using ensembles to construct **better synthetic controls**:

1. Fit many different prediction models to the donor pool data.
2. Use the ensemble to predict the counterfactual outcome for the treated unit.
3. The treatment effect is the difference between observed and ensemble-predicted outcomes.

---
### Ensemble Methods for Causal Inference

**Why?** No single model (e.g., linear regression with fixed predictors) is guaranteed to be correct. The ensemble hedges against model misspecification.

---
### How It Works: Super Learner

The **Super Learner** algorithm (van der Laan et al. 2007) is a popular ensemble method:

1. Define a library of candidate algorithms (linear regression, LASSO, random forest, etc.).
2. Use cross-validation to estimate each algorithm's performance.
3. Find the optimal weighted combination that minimizes cross-validated error.
4. The final prediction is a weighted average of all candidate models.

---
### How It Works: Super Learner

The weights tell you which algorithms are most useful for your data.

---
### Example: Counterfactual Time Series with Ensembles

Recall our Mali example. Instead of choosing one set of predictors and one weighting scheme, we could:


``` r
library(SuperLearner)
library(origami)

# Step 1: Subset to pre-treatment period and select relevant columns
pre_data &lt;- malidata[malidata$year &lt; 1991, 
                     c("WBCode", "year", "lngdpmad", "lngdpmadlag", "lnpop", "openk", "civwar")]

# Step 2: Separate Mali and donors
mali_pre &lt;- pre_data[pre_data$WBCode == "MLI", ]
donors_pre &lt;- pre_data[pre_data$WBCode != "MLI", ]

# Step 3: Convert civwar to numeric
donors_pre$civwar &lt;- as.numeric(as.character(donors_pre$civwar))
mali_pre$civwar &lt;- as.numeric(as.character(mali_pre$civwar))
```

---


``` r
# Step 4: Handle missing values (listwise deletion on predictors only)
predictors &lt;- c("lngdpmadlag", "lnpop", "openk", "civwar")
donors_clean &lt;- donors_pre[complete.cases(donors_pre[, predictors]), ]
mali_clean &lt;- mali_pre[complete.cases(mali_pre[, predictors]), ]

# Check if we have data
if (nrow(donors_clean) == 0) stop("No donor observations with complete predictors")
if (nrow(mali_clean) == 0) stop("No Mali pre-treatment observations with complete predictors")

# Step 5: Define algorithm library (install packages if needed)
SL.library &lt;- c("SL.lm", "SL.mean")  # start simple; add others later
```

---


``` r
# Step 6: Fit Super Learner
set.seed(2026)
sl_fit &lt;- SuperLearner(Y = donors_clean$lngdpmad,
                       X = donors_clean[, predictors],
                       SL.library = SL.library,
                       cvControl = list(V = 5))

# Step 7: Predict for Mali
pred &lt;- predict(sl_fit, newdata = mali_clean[, predictors])

# Step 8: Compare actual vs predicted
plot(mali_clean$year, mali_clean$lngdpmad, type = "l", col = "blue",
     ylim = range(c(mali_clean$lngdpmad, pred$pred)),
     xlab = "Year", ylab = "Log GDP", main = "Mali: Actual vs Ensemble Prediction")
lines(mali_clean$year, pred$pred, col = "red", lty = 2)
legend("topright", legend = c("Actual", "Ensemble"), col = c("blue", "red"), lty = 1:2)
```

---

![](7synthetic_files/figure-html/ensemble_example_plot-1.png)&lt;!-- --&gt;

---
### Interpreting the Ensemble


``` r
# See the weights assigned to each algorithm
sl_fit$coef
```

```
##    SL.lm_All  SL.mean_All 
## 0.9993896397 0.0006103603
```

- If `SL.lm` gets weight 0.7 and `SL.mean` gets weight 0.3, the ensemble relies mostly on linear regression but also uses the mean. What we see instead is a nearly pure regression.
- The cross-validated risk tells you how well the ensemble performs.

---
### Interpreting the Ensemble


**Caveat**: The ensemble is only as good as its candidate algorithms. If all algorithms are misspecified, the ensemble will also be misspecified – but it will usually be better than any single one.

---

## Synthetic Control: Weighted Units

- **Core idea**: The counterfactual for the treated unit is a weighted average of the **donor units**.
- Weights `\(w_j \ge 0\)`, `\(\sum_j w_j = 1\)`.
- The resulting counterfactual lies within the **convex hull** of the donor outcomes – no extrapolation.
- You see exactly which countries contribute and how much.

*Example*: A synthetic Mali might be 60% Burkina Faso + 30% Niger + 10% Senegal.

---

## Ensemble Counterfactual: Weighted Algorithms

- In the Mali **Super Learner** example, we built a counterfactual by averaging **prediction models**.
- Each model (linear regression, random forest, etc.) is fit on the donor data, then applied to Mali.
- The ensemble weight `\(\alpha_k\)` tells how much we trust each **algorithm**, not each country.
- The result can fall **outside the range of observed donor outcomes** – it may extrapolate.

---

## Key Differences

| | Synthetic Control | Ensemble (Super Learner) |
|---|---|---|
| **What is weighted** | Donor units (countries) | Prediction algorithms |
| **Constraint** | `\(w_j \ge 0,\ \sum w_j = 1\)` | `\(\alpha_k \ge 0,\ \sum \alpha_k = 1\)` |
| **Counterfactual** | A blend of real countries | A statistical best‑guess |
| **Interpretability** | High – see which countries matter | Lower – models are black‑box |
| **When to use** | Small donor pool, linearity plausible | Many donors, complex patterns |

Both aim to impute `\(Y(0)\)`, but they take different paths to get there.
---
### Ensembles for Sensitivity Analysis

Ensembles can also serve a **sensitivity analysis** role:

1. Fit an ensemble model to the control group.
2. Fit an ensemble model to the treatment group (using pre-treatment data).
3. Predict outcomes for **all** units under both models.
4. The difference in predictions gives an estimate of the treatment effect that is **robust** to model choice.

---

If the treatment effect estimate is similar across many model specifications, we gain confidence that it's not an artifact of a particular model.

---

### A Caution on Cross-Validation with Time Series

- Standard 5‑fold CV randomly partitions rows, assuming independent observations.
- With panel data (countries × years), random folds can place **future years** in the training set and **past years** in the validation set.
- This leaks information from the future, leading to **overly optimistic** estimates of model performance.
- For time‑series forecasting, use **blocked**, **rolling‑origin**, or **time‑series‑specific CV** that respects temporal order.
- In the Mali example, we used standard CV for simplicity; in practice, use a time‑aware CV scheme for an honest assessment.

---
### Back to the Peru Example

We could use an ensemble to check whether the effect of `simpletreat` on `outsidervote` is robust to how we model the relationship:

---


``` r
# Split data by treatment status
peruemotionssmall &lt;- na.omit(data.frame(simpletreat=peruemotions$simpletreat,
                                outsidervote=peruemotions$outsidervote,
                                age=peruemotions$age,
                                Cuzco=peruemotions$Cuzco,
                                edlevel=peruemotions$edlevel))
control_data &lt;- peruemotionssmall[peruemotionssmall$simpletreat == 0, ]
treated_data &lt;- peruemotionssmall[peruemotionssmall$simpletreat == 1, ]

# Fit ensemble to control group (predict outcome from covariates)
sl_control &lt;- SuperLearner(Y = control_data$outsidervote,
                           X = control_data[, c("age", "Cuzco", "edlevel")],
                           SL.library = c("SL.lm", "SL.glmnet", "SL.mean"))

# Predict counterfactual outcomes for treated group
pred_control &lt;- predict(sl_control, newdata = treated_data)$pred

# Estimated treatment effect = observed - counterfactual
mean(treated_data$outsidervote - pred_control)
```

```
## [1] 0.1060794
```

---
### Summary: Ensembles for Causal Inference

- Ensembles combine multiple models to improve prediction and reduce model dependence.
- In synthetic control, they can create more robust counterfactuals.
- In sensitivity analysis, they help assess whether results are sensitive to model choice.
- The **Super Learner** algorithm provides a principled way to weight models.

**Key takeaway**: When you're unsure which model is correct, don't pick one – average over many.

---

## Final Takeaway

- **Synthetic control** gives you a transparent, unit‑weighted counterfactual when parallel trends is implausible.
- **Sensitivity analysis** tells you how much hidden bias would be needed to overturn your results.
- **Ensemble methods** hedge against model misspecification by averaging over many learners.
- All three tools make your causal claims more credible by **systematically probing** what can go wrong.
